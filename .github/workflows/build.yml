      - name: Ghi services.dart
        run: |
          cat > app/lib/services.dart <<'EOF'
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:convert';
          import 'package:http/http.dart' as http;

          class ProgressService {
            static const _kDone = 'done_lessons';
            static const _kStreak = 'streak';
            static const _kLast = 'last_day';

            static Future<Set<String>> getDoneLessons() async {
              final p = await SharedPreferences.getInstance();
              return (p.getStringList(_kDone) ?? []).toSet();
            }

            static Future<void> markDone(String id) async {
              final p = await SharedPreferences.getInstance();
              final list = (p.getStringList(_kDone) ?? []).toSet();
              list.add(id);
              await p.setStringList(_kDone, list.toList());
              final today = DateTime.now().toIso8601String().substring(0, 10);
              final last = p.getString(_kLast);
              if (last == today) return;
              int s = p.getInt(_kStreak) ?? 0;
              if (last != null) {
                final diff = DateTime.now().difference(DateTime.parse(last)).inDays;
                s = (diff == 1) ? s + 1 : 1;
              } else {
                s = 1;
              }
              await p.setInt(_kStreak, s);
              await p.setString(_kLast, today);
            }

            static Future<int> getStreak() async {
              final p = await SharedPreferences.getInstance();
              return p.getInt(_kStreak) ?? 0;
            }
          }

          class AiService {
            static const String apiKey = 'YOUR_GEMINI_API_KEY';
            static const String url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';

            static Future<String> ask(String prompt) async {
              if (apiKey == 'YOUR_GEMINI_API_KEY') return '(Chua cau hinh API key.)';
              try {
                final r = await http.post(Uri.parse('$url?key=$apiKey'),
                  headers: {'Content-Type': 'application/json'},
                  body: jsonEncode({'contents': [{'parts': [{'text': prompt}]}]}));
                final d = jsonDecode(r.body);
                return d['candidates'][0]['content']['parts'][0]['text'] ?? '';
              } catch (e) { return 'Loi AI: $e'; }
            }

            static Future<String> correctEnglish(String t) => ask('Sua loi tieng Anh: "$t"');
            static Future<String> translate(String t) => ask('Dich sang tieng Viet: "$t"');
          }
          EOF

      - name: Ghi screens.dart
        run: |
          cat > app/lib/screens.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          import 'models.dart';
          import 'data.dart';
          import 'services.dart';

          class RoadmapScreen extends StatefulWidget {
            const RoadmapScreen({super.key});
            @override
            State<RoadmapScreen> createState() => _RoadmapScreenState();
          }

          class _RoadmapScreenState extends State<RoadmapScreen> {
            Set<String> done = {};
            @override
            void initState() { super.initState(); _load(); }
            Future<void> _load() async {
              final d = await ProgressService.getDoneLessons();
              setState(() => done = d);
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Lo trinh hoc'), backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                body: ListView.builder(
                  padding: const EdgeInsets.all(16),
                  itemCount: roadmap.length,
                  itemBuilder: (_, i) {
                    final lv = roadmap[i];
                    return Card(margin: const EdgeInsets.only(bottom: 16), child: ExpansionTile(
                      title: Text('${lv.code} - ${lv.name}', style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text(lv.description),
                      children: lv.lessons.map((ls) {
                        final isDone = done.contains(ls.id);
                        return ListTile(
                          leading: Icon(isDone ? Icons.check_circle : Icons.radio_button_unchecked, color: isDone ? Colors.green : Colors.grey),
                          title: Text(ls.title),
                          trailing: const Icon(Icons.chevron_right),
                          onTap: () async {
                            await Navigator.push(context, MaterialPageRoute(builder: (_) => LessonScreen(lesson: ls)));
                            _load();
                          },
                        );
                      }).toList(),
                    ));
                  },
                ),
              );
            }
          }

          class LessonScreen extends StatelessWidget {
            final Lesson lesson;
            const LessonScreen({super.key, required this.lesson});
            IconData _ic(String t) {
              switch (t) {
                case 'nghe': return Icons.headphones;
                case 'noi': return Icons.mic;
                case 'doc': return Icons.menu_book;
                case 'viet': return Icons.edit;
                case 'dich': return Icons.translate;
                default: return Icons.circle;
              }
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(lesson.title), backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  ...lesson.skills.map((s) => Card(child: ListTile(
                    leading: Icon(_ic(s.type), color: Colors.indigo),
                    title: Text(s.title),
                    subtitle: Text(s.type.toUpperCase()),
                    trailing: const Icon(Icons.chevron_right),
                    onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => SkillScreen(skill: s))),
                  ))),
                  const SizedBox(height: 24),
                  ElevatedButton.icon(
                    icon: const Icon(Icons.check),
                    label: const Text('Danh dau da hoan thanh'),
                    onPressed: () async {
                      await ProgressService.markDone(lesson.id);
                      if (context.mounted) {
                        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Da luu tien do!')));
                        Navigator.pop(context);
                      }
                    },
                  ),
                ]),
              );
            }
          }

          class SkillScreen extends StatefulWidget {
            final Skill skill;
            const SkillScreen({super.key, required this.skill});
            @override
            State<SkillScreen> createState() => _SkillScreenState();
          }

          class _SkillScreenState extends State<SkillScreen> {
            final FlutterTts _tts = FlutterTts();
            final stt.SpeechToText _speech = stt.SpeechToText();
            bool _listening = false;
            String _spoken = '';
            String _ai = '';
            @override
            void initState() {
              super.initState();
              _tts.setLanguage('en-US');
              _tts.setSpeechRate(0.45);
            }
            Future<void> _listen() async {
              if (!_listening) {
                final ok = await _speech.initialize();
                if (ok) {
                  setState(() { _listening = true; _spoken = ''; });
                  _speech.listen(localeId: 'en_US', onResult: (r) => setState(() => _spoken = r.recognizedWords));
                }
              } else {
                setState(() => _listening = false);
                _speech.stop();
                final r = await AiService.correctEnglish(_spoken);
                setState(() => _ai = r);
              }
            }
            @override
            Widget build(BuildContext context) {
              final s = widget.skill;
              return Scaffold(
                appBar: AppBar(title: Text(s.title), backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  Card(child: Padding(padding: const EdgeInsets.all(16), child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('Noi dung', style: Theme.of(context).textTheme.titleMedium),
                      const SizedBox(height: 8),
                      Text(s.content, style: const TextStyle(fontSize: 16)),
                      const SizedBox(height: 12),
                      Row(children: [
                        ElevatedButton.icon(icon: const Icon(Icons.volume_up), label: const Text('Nghe'), onPressed: () => _tts.speak(s.content)),
                        const SizedBox(width: 12),
                        ElevatedButton.icon(icon: Icon(_listening ? Icons.stop : Icons.mic), label: Text(_listening ? 'Dung' : 'Noi'), onPressed: _listen),
                      ]),
                    ],
                  ))),
                  if (_spoken.isNotEmpty) Card(color: Colors.blue.shade50, child: Padding(padding: const EdgeInsets.all(16), child: Text('Ban noi: $_spoken'))),
                  if (_ai.isNotEmpty) Card(color: Colors.green.shade50, child: Padding(padding: const EdgeInsets.all(16), child: Text('AI: $_ai'))),
                  const SizedBox(height: 16),
                  const Text('Cau hoi luyen tap:', style: TextStyle(fontWeight: FontWeight.bold)),
                  ...s.questions.asMap().entries.map((e) => Card(child: ListTile(
                    title: Text(e.value),
                    trailing: TextButton(child: const Text('Dap an'), onPressed: () {
                      showDialog(context: context, builder: (_) => AlertDialog(
                        title: const Text('Dap an'), content: Text(s.answers[e.key]),
                        actions: [TextButton(onPressed: () => Navigator.pop(context), child: const Text('OK'))],
                      ));
                    }),
                  ))),
                ]),
              );
            }
          }

          class TranslateScreen extends StatefulWidget {
            const TranslateScreen({super.key});
            @override
            State<TranslateScreen> createState() => _TranslateScreenState();
          }

          class _TranslateScreenState extends State<TranslateScreen> {
            final _c = TextEditingController();
            final _tts = FlutterTts();
            String _r = '';
            bool _l = false;
            Future<void> _go() async {
              if (_c.text.isEmpty) return;
              setState(() => _l = true);
              final r = await AiService.translate(_c.text);
              setState(() { _r = r; _l = false; });
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Dich Anh - Viet'), backgroundColor: Colors.teal, foregroundColor: Colors.white),
                body: Padding(padding: const EdgeInsets.all(16), child: Column(children: [
                  TextField(controller: _c, maxLines: 4, decoration: const InputDecoration(border: OutlineInputBorder(), hintText: 'Nhap cau tieng Anh...')),
                  const SizedBox(height: 12),
                  Row(children: [
                    ElevatedButton.icon(icon: const Icon(Icons.translate), label: const Text('Dich'), onPressed: _go),
                    const SizedBox(width: 12),
                    ElevatedButton.icon(icon: const Icon(Icons.volume_up), label: const Text('Doc'), onPressed: () => _tts.speak(_c.text)),
                  ]),
                  const SizedBox(height: 20),
                  if (_l) const CircularProgressIndicator(),
                  if (_r.isNotEmpty) Card(color: Colors.teal.shade50, child: Padding(padding: const EdgeInsets.all(16), child: Text(_r, style: const TextStyle(fontSize: 16)))),
                ])),
              );
            }
          }
          EOF

      - name: Ghi main.dart
        run: |
          cat > app/lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'screens.dart';
          import 'services.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Learn English',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(colorScheme: ColorScheme.fromSeed(seedColor: Colors.indigo), useMaterial3: true),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int streak = 0;
            int done = 0;
            @override
            void initState() { super.initState(); _load(); }
            Future<void> _load() async {
              final s = await ProgressService.getStreak();
              final d = await ProgressService.getDoneLessons();
              setState(() { streak = s; done = d.length; });
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Hoc Tieng Anh 0 -> Thanh thao'),
                  backgroundColor: Colors.indigo,
                  foregroundColor: Colors.white,
                ),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  Row(children: [
                    _card('Streak', '$streak ngay', Colors.orange),
                    const SizedBox(width: 12),
                    _card('Da hoc', '$done bai', Colors.green),
                  ]),
                  const SizedBox(height: 24),
                  _btn(Icons.map, 'Lo trinh hoc', 'A0 -> C1, 5 ky nang', Colors.indigo, () async {
                    await Navigator.push(context, MaterialPageRoute(builder: (_) => const RoadmapScreen()));
                    _load();
                  }),
                  const SizedBox(height: 12),
                  _btn(Icons.translate, 'Dich Anh - Viet', 'Dich nhanh + doc to', Colors.teal, () {
                    Navigator.push(context, MaterialPageRoute(builder: (_) => const TranslateScreen()));
                  }),
                ]),
              );
            }
            Widget _card(String l, String v, Color c) {
              return Expanded(child: Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(color: c.withOpacity(0.12), borderRadius: BorderRadius.circular(16)),
                child: Column(children: [
                  Text(l, style: TextStyle(color: c, fontWeight: FontWeight.w600)),
                  const SizedBox(height: 6),
                  Text(v, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                ]),
              ));
            }
            Widget _btn(IconData i, String t, String s, Color c, VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(16),
                child: Container(
                  padding: const EdgeInsets.all(20),
                  decoration: BoxDecoration(color: c, borderRadius: BorderRadius.circular(16)),
                  child: Row(children: [
                    Icon(i, color: Colors.white, size: 36),
                    const SizedBox(width: 16),
                    Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text(t, style: const TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                      Text(s, style: const TextStyle(color: Colors.white70)),
                    ])),
                    const Icon(Icons.chevron_right, color: Colors.white),
                  ]),
                ),
              );
            }
          }
          EOF

      - name: Sua AndroidManifest
        run: |
