name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Tao project Flutter
        run: flutter create app --project-name learn_english --org com.example --platforms=android

      - name: Ghi pubspec.yaml
        run: |
          cat > app/pubspec.yaml <<'EOF'
          name: learn_english
          description: App hoc tieng Anh 0 den thanh thao
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            shared_preferences: ^2.2.2
            http: ^1.2.0
            flutter_tts: ^4.0.2
            speech_to_text: ^6.6.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Ghi models.dart
        run: |
          cat > app/lib/models.dart <<'EOF'
          class Skill {
            final String type;
            final String title;
            final String content;
            final List<String> questions;
            final List<String> answers;
            Skill({required this.type, required this.title, required this.content, required this.questions, required this.answers});
          }

          class Lesson {
            final String id;
            final String title;
            final String level;
            final List<Skill> skills;
            Lesson({required this.id, required this.title, required this.level, required this.skills});
          }

          class Level {
            final String code;
            final String name;
            final String description;
            final List<Lesson> lessons;
            Level({required this.code, required this.name, required this.description, required this.lessons});
          }
          EOF

