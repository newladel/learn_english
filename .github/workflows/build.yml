name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Tao cau truc Android
        run: flutter create . --project-name learn_english --org com.example --platforms=android

      - name: Restore custom files
        run: |
          git checkout lib/ pubspec.yaml android/app/src/main/AndroidManifest.xml || true

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: learn-english-apk
          path: build/app/outputs/flutter-apk/app-release.apk
